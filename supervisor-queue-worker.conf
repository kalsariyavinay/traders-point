[program:traders-point-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /path/to/traders-point/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/path/to/traders-point/storage/logs/queue-worker.log
stopwaitsecs=3600

; INSTALLATION INSTRUCTIONS:
; 1. Copy this file to /etc/supervisor/conf.d/traders-point-worker.conf
; 2. Update the paths:
;    - /path/to/traders-point/artisan
;    - /path/to/traders-point/storage/logs/queue-worker.log
; 3. Update the user (www-data on Ubuntu, apache on CentOS)
; 4. Run: sudo supervisorctl reread
; 5. Run: sudo supervisorctl update
; 6. Run: sudo supervisorctl start traders-point-worker:*
; 7. Check status: sudo supervisorctl status
