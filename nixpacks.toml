[phases.setup]
nixPkgs = ['php82', 'php82Extensions.mbstring', 'php82Extensions.pdo', 'php82Extensions.pdo_mysql', 'php82Extensions.gd', 'php82Extensions.zip', 'nginx', 'nodejs_20', 'npm-9_x']

[phases.install]
cmds = [
  'mkdir -p /var/log/nginx && mkdir -p /var/cache/nginx',
  'composer install --ignore-platform-reqs',
  'npm install'
]

[phases.build]
cmds = [
  'npm run build',
  'php artisan storage:link'
]

[start]
cmd = 'php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT'
